<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegDOX | The Data Never Leaves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1628; --line-dark:#27406A;
    --accent:#159AAC; --accent-bright:#3CC6D8;
    --ok:#5FB98A; --warn:#C24A3C; --warn-bright:#E2705F;
    --on-dark-1:#C7D2E2; --on-dark-2:#9DB0CE; --on-dark-3:#5E769A;
    --mono:'IBM Plex Mono',monospace; --disp:'Archivo',sans-serif; --body:'IBM Plex Sans',sans-serif;
  }
  body{margin:0;background:var(--ink);font-family:var(--body);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;box-sizing:border-box;}
  .widget{max-width:880px;width:100%;border:1px solid rgba(60,198,216,.35);border-radius:12px;background:linear-gradient(172deg,#11304F,#0A1C38 60%,#081527);box-shadow:0 0 0 1px rgba(60,198,216,.10),0 40px 100px rgba(0,0,0,.6),0 0 110px rgba(21,154,172,.14);overflow:hidden;position:relative;}
  .widget::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(122,150,190,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(122,150,190,.045) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 85% 75% at 50% 30%,#000 30%,transparent 80%);pointer-events:none;}
  .whead{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line-dark);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#B8CCE6;}
  .whead .live{color:var(--ok);display:flex;align-items:center;gap:7px;}
  .whead .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(95,185,138,.45);}50%{opacity:.4;box-shadow:0 0 0 6px rgba(95,185,138,0);}}
  svg{display:block;width:100%;height:auto;position:relative;}

  /* status readout */
  .status{position:relative;height:20px;margin:2px 0 6px;}
  .status span{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--on-dark-3);opacity:0;animation:cycle 18s linear infinite;}
  .status span:nth-child(2){animation-delay:6s;}
  .status span:nth-child(3){animation-delay:12s;}
  @keyframes cycle{0%{opacity:0;}3%,30%{opacity:1;}36%,100%{opacity:0;}}
  .wfoot{position:relative;text-align:center;font-size:14.5px;color:var(--on-dark-1);padding:0 24px 22px;}
  .wfoot b{color:#7FE0EE;}

  /* ---- documents orbiting slowly inside the cloud ---- */
  .orb{animation:orbit 26s linear infinite;}
  .orb.o2{animation-duration:32s;animation-delay:-11s;}
  .orb.o3{animation-duration:29s;animation-delay:-20s;}
  @keyframes orbit{from{offset-distance:0%;}to{offset-distance:100%;}}

  /* ---- boundary: marching inner ring ---- */
  .ring-march{stroke-dasharray:2 10;animation:march 40s linear infinite;}
  @keyframes march{to{stroke-dashoffset:-480;}}

  /* ---- session traffic ---- */
  .frame{animation:framedown 3.8s cubic-bezier(.4,.1,.6,.9) infinite;}
  .frame.f2{animation-delay:-1.3s;}
  .frame.f3{animation-delay:-2.5s;}
  @keyframes framedown{0%{offset-distance:0%;opacity:0;}10%{opacity:.9;}85%{opacity:.9;}100%{offset-distance:100%;opacity:0;}}
  .key{animation:keyup 4.6s cubic-bezier(.4,.1,.6,.9) infinite;}
  .key.k2{animation-delay:-1.8s;}
  .key.k3{animation-delay:-3.2s;}
  @keyframes keyup{0%{offset-distance:100%;opacity:0;}10%{opacity:1;}85%{opacity:1;}100%{offset-distance:0%;opacity:0;}}

  /* ---- viewer screens: scrolling ghost lines ---- */
  .scroll{animation:scroll 7s linear infinite;}
  @keyframes scroll{from{transform:translateY(0);}to{transform:translateY(-22px);}}

  /* ---- escape attempt: drift out, dissolve at boundary ---- */
  .escape{animation:escape 12s cubic-bezier(.5,0,.6,1) infinite;}
  .escape *{transform-box:fill-box;transform-origin:center;}
  .escape .card{animation:dissolve 12s ease-in-out infinite;}
  @keyframes escape{0%,22%{offset-distance:0%;opacity:0;}26%{opacity:1;}44%{offset-distance:100%;}100%{offset-distance:100%;opacity:0;}}
  @keyframes dissolve{0%,40%{transform:scale(1);opacity:1;filter:blur(0);}47%{transform:scale(.55);opacity:0;filter:blur(2px);}100%{opacity:0;}}
  .arcflash{stroke-dasharray:90;stroke-dashoffset:90;animation:arc 12s ease-out infinite;}
  @keyframes arc{0%,41%{stroke-dashoffset:90;opacity:0;}45%{stroke-dashoffset:0;opacity:.95;}55%{opacity:.95;}64%,100%{stroke-dashoffset:0;opacity:0;}}
  .btag{opacity:0;animation:btag 12s ease-in-out infinite;}
  @keyframes btag{0%,43%{opacity:0;}47%,58%{opacity:1;}66%,100%{opacity:0;}}
  .ret{animation:ret 12s ease-in infinite;}
  @keyframes ret{0%,48%{offset-distance:100%;opacity:0;}52%{opacity:.85;}68%{offset-distance:0%;opacity:0;}100%{opacity:0;}}
  .lane2 .escape,.lane2 .escape .card{animation-delay:-6s;}
  .lane2 .arcflash,.lane2 .btag,.lane2 .ret{animation-delay:-6s;}

  @media(prefers-reduced-motion:reduce){
    .orb,.ring-march,.frame,.key,.scroll,.escape,.escape .card,.arcflash,.btag,.ret{animation:none!important;}
    .escape,.arcflash,.btag,.ret{opacity:0!important;}
    .status span{animation:none;opacity:0;}
    .status span:first-child{opacity:1;}
    .whead .live::before{animation:none;}
  }
</style>
</head>
<body>
<div class="widget">

    <text x="408" y="336" fill="#5E769A" font-family="'IBM Plex Mono',monospace" font-size="8" letter-spacing="2">SESSION &middot; K&middot;V&middot;M</text>

    <circle class="key" r="2" fill="#3CC6D8" filter="url(#glow)" style="offset-path:path('M330,240 C300,300 225,335 175,392');"/>

          <line x1="5" y1="24" x2="17" y2="24" stroke="#AEE9F2" stroke-width="1.6"/>
        </g>

        <g transform="translate(-14,-18)">

          <line x1="5" y1="12" x2="23" y2="12" stroke="#EAFBFE" stroke-width="1.6"/>
          <line x1="5" y1="18" x2="23" y2="18" stroke="#AEE9F2" stroke-width="1.6"/>
          <line x1="5" y1="24" x2="17" y2="24" stroke="#AEE9F2" stroke-width="1.6"/>
        </g>

        <g transform="translate(-14,-18)">

          <line x1="5" y1="18" x2="23" y2="18" stroke="#AEE9F2" stroke-width="1.6"/>
          <line x1="5" y1="24" x2="17" y2="24" stroke="#AEE9F2" stroke-width="1.6"/>
        </g>

    <g stroke="#3CC6D8" stroke-width="2.5" fill="none" filter="url(#glow)">

    <!-- ===== escape attempts: drift out, dissolve at the wall ===== -->
    <g class="lane1">

      <g class="btag"><rect x="216" y="286" width="62" height="17" rx="8.5" fill="#C24A3C"/><text x="247" y="298" text-anchor="middle" fill="#fff" font-family="'IBM Plex Mono',monospace" font-size="8" font-weight="600" letter-spacing="1.5">BLOCKED</text></g>
      <circle class="ret" r="1.8" fill="#F0A794" style="offset-path:path('M372,168 C350,205 325,235 297,262');"/>
      <circle class="ret" r="1.3" fill="#F0A794" style="offset-path:path('M366,176 C346,210 322,240 300,258');animation-delay:.25s;"/>

    <g class="lane2">
      <g class="escape" style="offset-path:path('M432,168 C455,205 478,235 505,262');offset-rotate:0deg;">

      <circle class="ret" r="1.8" fill="#F0A794" style="offset-path:path('M432,168 C455,205 478,235 505,262');"/>

        </g></g>
        <text x="60" y="46" text-anchor="middle" fill="#3CC6D8" font-size="5" letter-spacing="1.5" opacity=".35" transform="rotate(-14 60 40)">VIEW ONLY</text>
        <path d="M6,56 L114,56 L106,67 L14,67 z" fill="#102C4F" stroke="#3B5E8A" stroke-width="1.3"/>
        <text x="60" y="88" text-anchor="middle" fill="#C7D2E2" font-size="9.5" letter-spacing="1">OFFICE PC</text>

        <circle cx="29" cy="19.5" r="1.3" fill="#3CC6D8"/><text x="34" y="22" fill="#7FA5CB" font-size="4.5" letter-spacing="1">ENCLAVE VIEWER</text>

  </svg>

  <div class="status">

</body>
